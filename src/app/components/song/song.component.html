<div class="app-editor-content-wrapper">

    <div class="app-editor-toolbar">
        <div class="app-label">Nahrávka</div>
        <div class="app-actions-right">
        </div>
    </div>  
      
    <div class="app-editor-content">
        @if (state === 'success') {
        <div class="app-song-wrapper">
            <div class="app-controls">
                <div class="app-track-position">
                    {{ formatTime(currentTime) }}
                    <input 
                        type="range" 
                        min="0" 
                        [max]="duration || 100" 
                        [value]="currentTime" 
                        (mousedown)="onSliderStart()"
                        (touchstart)="onSliderStart()"
                        (input)="onSliderInput($event)"
                        (change)="onSliderChange($event)"
                    />

                    {{ formatTime(duration)}}

                    <!-- <mat-slider min="0" [max]="trackDuration" step="0.5">
                        <input matSliderThumb [(ngModel)]="audio.currentTime">
                    </mat-slider> -->

                   {{ trackPositionText }}@if (trackDurationText !== 'Infinity') { {{ trackDurationText }} }
                </div>
                @if (playing) {
                    <mat-icon class="app-button" (click)="moveBackward()">fast_rewind</mat-icon>
                    <mat-icon class="app-button" (click)="pauseTrack()">pause_circle</mat-icon>
                    <mat-icon class="app-button" (click)="moveForward()">fast_forward</mat-icon>
                } @else {
                    <mat-icon class="app-button" (click)="playTrack()">play_circle</mat-icon>
                }
            </div>
        </div>
        }
    </div>
@if (state === 'loading') {
    <mat-spinner [strokeWidth]="5"  [diameter]="60" class="center-spinner"></mat-spinner>
}

</div>
