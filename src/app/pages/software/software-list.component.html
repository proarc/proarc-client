<div class="app-fxLayout app-column app-fill">
  <div class="app-fxLayout app-row app-center-v app-breadcrumbsbar">
    <div class="app-fxLayout app-row app-center-v app-inner app-pr-4">
      <a routerLink="/"><mat-icon>home</mat-icon></a>
      <span class="app-separator">/</span>
      <span class="app-last">{{ 'software.type.' + type | translate }}</span>
    </div>
  </div>

  @if (state === 'loading') {
    <mat-progress-bar mode="indeterminate" class="app-progress-bar"></mat-progress-bar>
  }

  <div class="app-fxFlex app-fxLayout app-column app-content-wrapper">
    <div class="app-formbar app-mb-2">
      <button mat-stroked-button [routerLink]="['/software', type, 'new']">
        {{ 'software.add' | translate }}
      </button>
    </div>

    <div class="app-fxFlex app-oa-y app-border-wrapper">
      <table mat-table [dataSource]="items" class="app-striped app-hover">
        <ng-container matColumnDef="label">
          <th mat-header-cell *matHeaderCellDef>{{ 'software.label' | translate }}</th>
          <td mat-cell *matCellDef="let item">
            <a [routerLink]="['/software', type, item.id]">{{ item.label }}</a>
          </td>
        </ng-container>
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef>{{ 'software.id' | translate }}</th>
          <td mat-cell *matCellDef="let item">{{ item.id }}</td>
        </ng-container>
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let item" class="actions">
            <button mat-icon-button (click)="preview(item)" [matTooltip]="'software.preview' | translate"><mat-icon>visibility</mat-icon></button>
            <button mat-icon-button color="primary" [routerLink]="['/software', type, item.id, 'edit']" [matTooltip]="'button.edit' | translate"><mat-icon>edit_note</mat-icon></button>
            <button mat-icon-button color="warn" (click)="remove(item)" [matTooltip]="'button.delete' | translate"><mat-icon>delete</mat-icon></button>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
      @if (state === 'success' && items.length === 0) {
        <div class="empty">{{ 'software.empty' | translate }}</div>
      }
    </div>
    <mat-paginator [length]="totalRows" [pageIndex]="pageIndex" [pageSize]="pageSize"
      [hidePageSize]="true" (page)="onPageChanged($event)"></mat-paginator>
  </div>
</div>
